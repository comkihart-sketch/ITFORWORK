<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Calendar Card Base -->
  <g filter="url(#shadow)">
    <!-- Main white card -->
    <rect x="10" y="14" width="44" height="40" rx="8" fill="#ffffff" />
    
    <!-- Top red/coral header -->
    <path d="M10 21C10 17.134 13.134 14 17 14H47C50.866 14 54 17.134 54 21V24H10V21Z" fill="url(#headerGrad)" />
    
    <!-- Binder Rings -->
    <rect x="18" y="10" width="4" height="8" rx="2" fill="#ffffff" />
    <rect x="42" y="10" width="4" height="8" rx="2" fill="#ffffff" />
    <rect x="19" y="11" width="2" height="6" rx="1" fill="#cbd5e1" />
    <rect x="43" y="11" width="2" height="6" rx="1" fill="#cbd5e1" />

    <!-- Shift Pills in Calendar Grid -->
    <!-- Row 1: Morning (Amber), Afternoon (Emerald), Night (Cyan) -->
    <rect x="15" y="28" width="9" height="5.5" rx="2" fill="#f59e0b" />
    <rect x="27.5" y="28" width="9" height="5.5" rx="2" fill="#10b981" />
    <rect x="40" y="28" width="9" height="5.5" rx="2" fill="#06b6d4" />
    
    <!-- Row 2: Off (Rose), Swap (Indigo), Extra (Purple) -->
    <rect x="15" y="37.5" width="9" height="5.5" rx="2" fill="#f43f5e" />
    <rect x="27.5" y="37.5" width="9" height="5.5" rx="2" fill="#6366f1" />
    <rect x="40" y="37.5" width="9" height="5.5" rx="2" fill="#8b5cf6" />
  </g>

  <!-- Glowing Live Shift Status Indicator -->
  <circle cx="49" cy="49" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
</svg>